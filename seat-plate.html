<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf3ff">
  <title data-text="plates">座位牌</title>
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="plate.css">
  <script src="i18n.js" defer></script>
  <script src="plate.js" defer></script>
</head>
<body class="plate-page">
  <div class="shell plate-shell">
    <header class="topbar glass plate-topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13V7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v6M4 13h16v4H4zM6 17v3m12-3v3"/></svg>
        </span>
        <span data-text="brand">自習室座位</span>
      </a>
      <nav aria-label="主選單" data-aria-label="navigation">
        <a class="nav-link" href="index.html" data-text="home">首頁</a>
        <button class="language-switch" type="button" data-language>English</button>
      </nav>
    </header>
    <main class="plate-main">
      <section class="glass plate-form-card" aria-labelledby="plate-title">
        <p class="eyebrow" data-text="roomSetup">自習室設置</p>
        <h1 id="plate-title" data-text="generatePlates">製作座位牌</h1>
        <p class="plate-subtitle" data-text="plateIntro">批量製作桌貼二維碼。到座後掃碼，簽到表便會自動填上座位編號。</p>
        <form id="plate-form" novalidate>
          <div class="field plate-field">
            <label for="plate-url" data-text="checkinUrl">簽到頁面網址</label>
            <input id="plate-url" type="url" inputmode="url" autocomplete="off" required placeholder="https://example.org/library/index.html" aria-describedby="plate-url-note">
            <p id="plate-url-note" class="field-hint" data-text="plateUrlNote">列印前，請確認手機可以開啟此網址。</p>
          </div>
          <div class="field plate-field">
            <label for="plate-codes" data-text="seatNumbers">座位編號</label>
            <textarea id="plate-codes" rows="3" maxlength="1600" spellcheck="false" autocapitalize="characters" required placeholder="A01, A02, A03" aria-describedby="plate-code-note"></textarea>
            <p id="plate-code-note" class="field-hint" data-text="codesNote">以逗號或換行分隔，每批最多 60 個座位。</p>
          </div>
          <p class="plate-provider" data-text="plateProvider">製作座位牌時，簽到網址和座位編號會傳送至外部二維碼服務 QR Server。此處無需輸入姓名、學生編號或電郵。</p>
          <p id="plate-error" class="plate-error" role="alert" hidden></p>
          <div class="plate-actions">
            <button type="submit" class="button primary" data-text="generate">製作座位牌</button>
            <button type="button" id="plate-print" class="button secondary" disabled data-text="print">列印</button>
          </div>
        </form>
      </section>
      <p id="plate-status" class="plate-status" role="status"></p>
      <section id="plates" class="plates" aria-label="座位牌" data-aria-label="plates" hidden></section>
    </main>
    <footer class="footer plate-footer"><span data-text="footer">CDT504 · 圖書館座位周轉系統</span></footer>
  </div>
</body>
</html>
