<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf3ff">
  <meta name="description" content="按樓層查看嶺南大學圖書館的演示座位狀態。" data-content="mapDescription">
  <title data-text="mapTitle">分層座位圖</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="map.css">
  <script src="i18n.js" defer></script>
  <script defer src="floor-data.js"></script>
  <script defer src="map.js"></script>
  <script defer src="register.js"></script>
</head>
<body class="map-page">
  <div class="shell">
    <header class="topbar glass">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13V7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v6M4 13h16v4H4zM6 17v3m12-3v3"/></svg>
        </span>
        <span data-text="brand">自習室座位</span>
      </a>
      <nav aria-label="主選單" data-aria-label="navigation">
        <a class="nav-link" href="index.html" data-text="home">首頁</a>
        <a class="nav-link" href="seat-map.html" aria-current="page" data-text="seatMap">座位圖</a>
        <button class="language-switch" type="button" data-language>English</button>
      </nav>
    </header>
    <main class="map-main">
      <header class="map-hero">
        <div>
          <p class="eyebrow" data-text="library">嶺南大學圖書館</p>
          <h1 data-text="findSeat">尋找空位</h1>
          <p class="map-intro" data-text="mapIntro">選擇樓層查看空位，到桌後再簽到。</p>
        </div>
        <div class="map-source">
          <span class="mode" data-text="demo">演示模式</span>
          <p data-text="mapDemoNote">底圖取自圖書館平面圖。彩色標點的座位編號及狀態為演示資料。</p>
        </div>
      </header>

      <div class="floor-tabs glass" id="floor-tabs" role="group" aria-label="選擇樓層" data-aria-label="chooseFloor"></div>
      <dl class="map-stats" aria-label="本層座位演示狀態" data-aria-label="floorStatuses">
        <div class="glass map-stat is-empty"><dt><span class="state-dot"></span><span data-text="empty">空位</span></dt><dd id="stat-empty">–</dd></div>
        <div class="glass map-stat is-occ"><dt><span class="state-dot"></span><span data-text="occ">在座</span></dt><dd id="stat-occ">–</dd></div>
        <div class="glass map-stat is-away"><dt><span class="state-dot"></span><span data-text="away">暫離</span></dt><dd id="stat-away">–</dd></div>
      </dl>

      <div class="map-workspace">
        <section class="glass map-board" aria-labelledby="layout-heading">
          <div class="map-board-heading">
            <div>
              <h2 id="layout-heading" data-text="floorPlan">樓層平面圖</h2>
              <p id="layout-caption" data-text="chooseZoneDetail">選擇區域查看座位詳情</p>
            </div>
            <button class="map-action" type="button" id="refresh-map" title="重新整理本機簽到狀態" data-title="refreshTitle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.4 6.7M20 5v6h-6"/></svg>
              <span data-text="refresh">重新整理</span>
            </button>
          </div>
          <div class="zone-tabs" id="zone-tabs" role="group" aria-label="放大區域" data-aria-label="zoomZone"></div>
          <div class="plan-canvas" id="plan-canvas">
            <img id="plan-image" alt="">
            <div class="plan-markers" id="plan-markers"></div>
          </div>
          <div class="map-board-footer">
            <div class="map-key" aria-label="圖例" data-aria-label="legend">
              <span class="is-empty"><i class="state-dot"></i><span data-text="empty">空位</span></span>
              <span class="is-occ"><i class="state-dot"></i><span data-text="occ">在座</span></span>
              <span class="is-away"><i class="state-dot"></i><span data-text="away">暫離</span></span>
            </div>
            <small data-text="planSource">平面圖來源 · 嶺南大學圖書館</small>
          </div>
        </section>

        <aside class="glass map-list" aria-labelledby="list-heading">
          <h2 id="list-heading" data-text="floorSeats">本層演示座位</h2>
          <p data-text="seatDetails">點選地圖上的標點或下方座位以查看詳情。</p>
          <div class="seat-list" id="seat-list"></div>
        </aside>
      </div>
      <p id="map-feedback" class="sr-only" role="status"></p>
      <noscript><p>請啟用 JavaScript 以查看座位狀態。</p></noscript>
    </main>
    <footer class="footer"><span data-text="footer">CDT504 · 圖書館座位周轉系統</span><span data-text="libraryFooter">嶺南大學圖書館</span></footer>
  </div>

  <dialog class="map-dialog" id="seat-dialog" aria-labelledby="seat-dialog-title">
    <form method="dialog">
      <p class="eyebrow" id="seat-dialog-code" data-text="seat">座位</p>
      <h2 id="seat-dialog-title" data-text="seatStatus">座位狀態</h2>
      <p id="seat-dialog-detail"></p>
      <div class="map-dialog-actions">
        <button class="map-action" type="submit" value="close" autofocus data-text="close">關閉</button>
        <a class="button primary" id="seat-checkin" href="checkin.html" hidden data-text="goCheckin">前往簽到</a>
      </div>
    </form>
  </dialog>
</body>
</html>
